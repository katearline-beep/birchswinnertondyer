name: Central curvature falsification diagnostics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  central:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install PARI/GP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pari-gp
          gp --version
      - name: Independent numerical derivative test (not a zero certificate)
        shell: bash
        run: |
          set -euo pipefail
          gp -q -f research/strategy/central_derivative_diagnostic.gp 2>&1 | tee central-diagnostic.log
          if grep -qF '***' central-diagnostic.log; then exit 1; fi
          grep -q '^PASS rank-two control ' central-diagnostic.log
          grep -q '^NUMERIC E234446_L2_40digits=' central-diagnostic.log
          grep -q '^NUMERIC E234446_L2_90digits=' central-diagnostic.log
          grep -q '^PASS central derivative exploratory diagnostics' central-diagnostic.log
      - name: Formal countermodel and factorization kill tests
        run: python3 -I -B research/strategy/kill_tests.py
      - name: Enumerate eligible quadratic fields for H3
        run: python3 -I -B research/strategy/field_tomography_candidates.py
