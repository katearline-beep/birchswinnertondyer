name: Exact arithmetic and independent verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-arithmetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout (immutable v4.2.2 SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python (immutable v5.6.0 SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Show environment
        run: |
          python --version
          git rev-parse HEAD
      - name: Exact field-arithmetic computation
        run: python -I -B research/split11/verify.py
      - name: Independent projective-arithmetic computation
        run: python -I -B research/split11/independent_check.py
      - name: Higher-precision split-11 kernel (rational + projective cross-check)
        run: python -I -B research/split11/kernel_mod11_4.py
      - name: Agboola-Castella local hypothesis certificate
        run: python -I -B research/anticyclotomic_11/verify_local_hypotheses.py
      - name: Exact quadratic-twist and mod-11 symmetry data check
        run: python -I -B research/anticyclotomic_11/verify_twist_descent.py
      - name: Exact syndrome and identifiability negative controls
        run: python -I -B research/methodology/local_kernel_negative_controls.py
      - name: Independent analytic error-budget component checks
        run: python -I -B research/anticyclotomic_11/audit_derivative_error_budget.py
      - name: Independent exact-rational twist derivative interval (provisional analytic hypotheses)
        run: python -I -B research/anticyclotomic_11/independent_rational_derivative.py
      - name: Verify cross-disciplinary experiment manifest and provenance
        run: python -I -B research/harness/validate.py
      - name: Reject fabricated review and malformed experiments
        run: python -I -B research/harness/test_validate.py
      - name: Exact bad-reduction and quadratic-twist root-sign audit
        run: python -I -B research/anticyclotomic_11/verify_root_sign.py
      - name: Leapfrog research protocol and bridge documentation
        run: python -I -B research/harness/validate_leapfrogs.py
      - name: Negative controls for speculative leapfrog claims
        run: python -I -B research/harness/test_leapfrogs.py
      - name: Derived Kato vs complex-L nonimplication tests
        run: python -I -B research/strategy/logic_gate_tests.py
      - name: Exact C11 augmentation and local torsion field-selection gate
        run: python -I -B research/strategy/kato_field_gate.py
      - name: Kato C11 field local torsion and Galois image input audit
        run: python -I -B research/strategy/kato_field_local_image_audit.py
      - name: Integral cyclotomic group-ring anti-vacuity and tower negative controls
        run: python -I -B research/strategy/cyclotomic_integrality_gate.py
      - name: Mazur-Tate 2025 theorem hypothesis and circularity negative control
        run: python -I -B research/strategy/mazur_tate_scope_test.py
      - name: Full BSD problem checkpoint and research-drift policy
        run: python -I -B research/harness/validate_full_review.py
      - name: Adversarial full-problem review negative controls
        run: python -I -B research/harness/test_full_review.py
      - name: Higher Gross-Zagier first vs third derivative falsification
        run: python -I -B research/strategy/h3_first_height_no_go.py
