name: Exact arithmetic and independent verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-arithmetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout (immutable v4.2.2 SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python (immutable v5.6.0 SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Show environment
        run: |
          python --version
          git rev-parse HEAD
      - name: Exact field-arithmetic computation
        run: python -I -B research/split11/verify.py
      - name: Independent projective-arithmetic computation
        run: python -I -B research/split11/independent_check.py
      - name: Higher-precision split-11 kernel (rational + projective cross-check)
        run: python -I -B research/split11/kernel_mod11_4.py
      - name: Agboola-Castella local hypothesis certificate
        run: python -I -B research/anticyclotomic_11/verify_local_hypotheses.py
