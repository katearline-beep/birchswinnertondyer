name: Exact arithmetic and independent verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-arithmetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout (immutable v4.2.2 SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python (immutable v5.6.0 SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Show environment
        run: |
          python --version
          git rev-parse HEAD
      - name: Exact field-arithmetic computation
        run: python -I -B research/split11/verify.py
      - name: Independent projective-arithmetic computation
        run: python -I -B research/split11/independent_check.py
      - name: Higher-precision split-11 kernel (rational + projective cross-check)
        run: python -I -B research/split11/kernel_mod11_4.py
      - name: Independent Jacobian all-column 11-adic corroboration
        run: python -I -B research/split11/independent_jacobian_all_columns.py
      - name: Primitive height-alignment negative control
        run: python -I -B research/methodology/height_alignment_scale_gate.py
      - name: BCLMN anticyclotomic character local coefficients and Fermat quotients
        run: python -I -B research/anticyclotomic_11/character_coefficients.py
      - name: Exact cross-height input points and denominator candidate supports
        run: python -I -B research/anticyclotomic_11/point_prerequisites.py
      - name: Independent minimal affine denominator primitivity and all six polarization checks
        run: python -I -B research/anticyclotomic_11/independent_affine_ideal_and_polarization.py
      - name: One-sided negative Selmer control and exact radical-domain countermodels
        run: python -I -B research/proof_labs/one_sided_selmer_control.py
      - name: Source-defined second Bockstein lift and quotient controls
        run: python -I -B research/proof_labs/second_bockstein_lift.py
      - name: MST canonical 11-adic sigma integrality and published E37 control
        run: python -I -B research/anticyclotomic_11/canonical_sigma_integrality_11.py
      - name: Conditional global heights mod121 and six polarization identities
        run: python -I -B research/anticyclotomic_11/conditional_heights_mod121.py
      - name: MST canonical sigma second digit and published E37 p5 control
        run: python -I -B research/anticyclotomic_11/canonical_sigma_integrality_121.py
      - name: Conditional global heights mod1331 and all six mixed polarizations
        run: python -I -B research/anticyclotomic_11/conditional_heights_mod1331.py
      - name: Published BCLMN 389a1 height-control at p=5
        run: python -I -B research/anticyclotomic_11/published_389a1_height_control.py
      - name: Provisional exact anticyclotomic first-digit height and bad-component falsification
        run: python -I -B research/anticyclotomic_11/provisional_height_mod11.py
      - name: Conditional first global-height radical and local kernel counterexample
        run: python -I -B research/anticyclotomic_11/conditional_first_radical_mod11.py
      - name: Agboola-Castella local hypothesis certificate
        run: python -I -B research/anticyclotomic_11/verify_local_hypotheses.py
      - name: Exact quadratic-twist and mod-11 symmetry data check
        run: python -I -B research/anticyclotomic_11/verify_twist_descent.py
      - name: Exact syndrome and identifiability negative controls
        run: python -I -B research/methodology/local_kernel_negative_controls.py
      - name: Independent analytic error-budget component checks
        run: python -I -B research/anticyclotomic_11/audit_derivative_error_budget.py
      - name: Independent exact-rational twist derivative interval (provisional analytic hypotheses)
        run: python -I -B research/anticyclotomic_11/independent_rational_derivative.py
      - name: Verify cross-disciplinary experiment manifest and provenance
        run: python -I -B research/harness/validate.py
      - name: Reject fabricated review and malformed experiments
        run: python -I -B research/harness/test_validate.py
      - name: Exact bad-reduction and quadratic-twist root-sign audit
        run: python -I -B research/anticyclotomic_11/verify_root_sign.py
      - name: Leapfrog research protocol and bridge documentation
        run: python -I -B research/harness/validate_leapfrogs.py
      - name: Negative controls for speculative leapfrog claims
        run: python -I -B research/harness/test_leapfrogs.py
      - name: Derived Kato vs complex-L nonimplication tests
        run: python -I -B research/strategy/logic_gate_tests.py
      - name: Exact C11 augmentation and local torsion field-selection gate
        run: python -I -B research/strategy/kato_field_gate.py
      - name: Kato C11 field local torsion and Galois image input audit
        run: python -I -B research/strategy/kato_field_local_image_audit.py
      - name: Integral cyclotomic group-ring anti-vacuity and tower negative controls
        run: python -I -B research/strategy/cyclotomic_integrality_gate.py
      - name: Mazur-Tate 2025 theorem hypothesis and circularity negative control
        run: python -I -B research/strategy/mazur_tate_scope_test.py
      - name: Full BSD problem checkpoint and research-drift policy
        run: python -I -B research/harness/validate_full_review.py
      - name: Adversarial full-problem review negative controls
        run: python -I -B research/harness/test_full_review.py
      - name: Oct23 residual norm versus second Bockstein nonimplication
        run: python -I -B research/reviews/controls/first_lift_second_obstruction_2026_10_23.py
      - name: Higher Gross-Zagier first vs third derivative falsification
        run: python -I -B research/strategy/h3_first_height_no_go.py
      - name: Conditional local-global Z11 split transversality and negative controls
        run: python -I -B research/methodology/local_global_transversality_11.py
      - name: Howard universal norm radical and second alternating height quotient falsifiers
        run: python -I -B research/proof_labs/howard_second_height_quotient_controls.py
      - name: Howard exact Up universal norm and zero weight-two base augmentation
        run: python -I -B research/proof_labs/howard_base_augmentation_gate.py
      - name: Howard trivial C10 norm and cohomological unique T division falsifiers
        run: python -I -B research/proof_labs/howard_bockstein_exact_sequence_gate.py
      - name: Divided Howard strict Greenberg local quotient preservation gates
        run: python -I -B research/proof_labs/howard_divided_greenberg_local_gate.py
      - name: Castella published weight-two Howard Heegner unit-specialization and divisibility gate
        run: python -I -B research/proof_labs/castella_howard_weight_prime_gate.py
      - name: Howard two-variable Hida and anticyclotomic jet falsification controls
        run: python -I -B research/proof_labs/two_variable_heegner_specialization_controls.py
      - name: Howard anticyclotomic ring class tower and Kolyvagin basepoint torsion gate
        run: python -I -B research/proof_labs/heegner_ring_class_tower_11.py
      - name: Howard focal Heegner entry and absolute residual irreducibility certificate
        run: python -I -B research/proof_labs/howard_heegner_residual_focal.py
      - name: Genuine Castella Hsieh 433a1 p11 Kminus7 rank two theorem control
        run: python -I -B research/proof_labs/castella_hsieh_433a1_control.py
      - name: Theorem-first Castella-Hsieh rank two Kato scope and contrapositive gate
        run: python -I -B research/proof_labs/kato_rank_scope_gate.py
      - name: Ulmer exact Fermat quotient rational map and Gamma group certificate
        run: python -I -B research/proof_labs/ulmer_fermat_quotient.py
      - name: Independent nontrivial F49 Ulmer Jacobi eigenvalue J=49
        run: python -I -B research/proof_labs/ulmer_jacobi_f49.py
      - name: Ulmer global Fermat zeta P2 Frobenius orbit and rank-field correction
        run: python -I -B research/proof_labs/ulmer_frobenius_orbits.py
      - name: Ulmer function-field high-rank published theorem local-fibre control
        run: python -I -B research/proof_labs/ulmer_function_field_fibres.py
      - name: 6000-term independent exact rational twist derivative certificate
        run: python -I -B research/anticyclotomic_11/independent_rational_derivative_6000.py
      - name: Actual anticyclotomic Artin character and faithful truncated tower action
        run: python -I -B research/proof_labs/anticyclotomic_artin_t3.py
      - name: Actual five-point Kummer reduction independence and11-saturation
        run: python -I -B research/proof_labs/kummer_reduction_11_certificate.py
      - name: Finite quotient Bockstein obstruction and nonabelian refinement controls
        run: python -I -B research/proof_labs/finite_quotient_bockstein_obstruction.py

      - name: Cartier duality and constrained versus unrestricted lift controls
        run: python -I -B research/proof_labs/global_duality_support_controls.py

      - name: Actual fine Kummer map and supported first-height detector
        run: python -I -B research/proof_labs/fine_localization_height_detector.py

      - name: Twist primary Selmer source prerequisites and valuation falsifiers
        run: python -I -B research/proof_labs/twist_primary_selmer_gate.py

      - name: Frozen exact Kurihara3389 certificate and integer-denominator prediction
        run: python -I -B research/proof_labs/verify_kurihara_3389.py research/proof_labs/certificates/session35_kurihara_3389.txt

      - name: Signed integral first-lift torsor and local-normalization boundaries
        run: python -I -B research/proof_labs/integral_first_lift_controls.py

      - name: Explicit local norm reference and certified infinite formal-log tail
        run: python -I -B research/proof_labs/local_norm_reference_11.py research/proof_labs/certificates/session37_local_norm_reference.txt
