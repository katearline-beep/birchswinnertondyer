name: Orthogonal Fourier coefficient validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fourier-oracle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install GP from distribution packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pari-gp
          gp --version
      - name: Generate PARI reference coefficients and reject interpreter errors
        shell: bash
        run: |
          set -euo pipefail
          gp -q -f research/harness/pari_fourier.gp > /tmp/bsd-pari-coefficients.txt 2>&1
          if grep -qF '***' /tmp/bsd-pari-coefficients.txt; then
            echo 'PARI produced an interpreter error' >&2
            tail -40 /tmp/bsd-pari-coefficients.txt >&2
            exit 1
          fi
          test "$(wc -l < /tmp/bsd-pari-coefficients.txt)" -eq 2000
      - name: Verify all coefficients and deliberate mutation control
        run: python -I -B research/harness/compare_fourier_coefficients.py /tmp/bsd-pari-coefficients.txt
      - name: Generate 6000 PARI Fourier coefficients and reject interpreter errors
        shell: bash
        run: |
          set -euo pipefail
          gp -q -f research/harness/pari_fourier_6000.gp > /tmp/bsd-pari-coefficients-6000.txt 2>&1
          if grep -qF '***' /tmp/bsd-pari-coefficients-6000.txt; then
            tail -40 /tmp/bsd-pari-coefficients-6000.txt >&2
            exit 1
          fi
          test "$(wc -l < /tmp/bsd-pari-coefficients-6000.txt)" -eq 6000
      - name: Verify 6000 coefficients and negative-control mutation
        run: python -I -B research/harness/compare_fourier_coefficients_6000.py /tmp/bsd-pari-coefficients-6000.txt
      - name: Install pinned independent ball-arithmetic library
        run: |
          python -m pip install --only-binary=:all: --no-deps python-flint==0.9.0
      - name: Independent Arb twist derivative certificate on PARI coefficients
        run: python -I -B research/anticyclotomic_11/arb_twist_derivative.py /tmp/bsd-pari-coefficients-6000.txt
      - name: Construct certified anticyclotomic layers and division polynomials
        shell: bash
        run: |
          set -euo pipefail
          gp -s 128000000 -q -f research/proof_labs/pari_anticyclotomic_artin_t3.gp > /tmp/bsd-artin-oracle.txt 2>&1
          gp -q -f research/proof_labs/pari_kummer_11_torsors.gp > /tmp/bsd-kummer-oracle.txt 2>&1
          if grep -qF '***' /tmp/bsd-artin-oracle.txt /tmp/bsd-kummer-oracle.txt; then
            tail -30 /tmp/bsd-artin-oracle.txt
            tail -30 /tmp/bsd-kummer-oracle.txt
            exit 1
          fi
      - name: Compare every ideal Artin value and coefficient with independent arithmetic
        run: python -I -B research/proof_labs/anticyclotomic_artin_t3.py /tmp/bsd-artin-oracle.txt
      - name: Construct and verify five actual Kummer division torsors
        run: python -I -B research/proof_labs/kummer_11_torsors.py /tmp/bsd-kummer-oracle.txt

  direct-height:
    name: Direct-coordinate global first-height oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Complete first-digit ideal oracle and published controls
        run: python -I -B research/anticyclotomic_11/direct_coordinate_height_mod11.py
