name: Orthogonal Fourier coefficient validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fourier-oracle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install GP from distribution packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pari-gp
          gp --version
      - name: Generate PARI reference coefficients and reject interpreter errors
        shell: bash
        run: |
          set -euo pipefail
          gp -q -f research/harness/pari_fourier.gp > /tmp/bsd-pari-coefficients.txt 2>&1
          if grep -qF '***' /tmp/bsd-pari-coefficients.txt; then
            echo 'PARI produced an interpreter error' >&2
            tail -40 /tmp/bsd-pari-coefficients.txt >&2
            exit 1
          fi
          test "$(wc -l < /tmp/bsd-pari-coefficients.txt)" -eq 2000
      - name: Verify all coefficients and deliberate mutation control
        run: python -I -B research/harness/compare_fourier_coefficients.py /tmp/bsd-pari-coefficients.txt
      - name: Generate 6000 PARI Fourier coefficients and reject interpreter errors
        shell: bash
        run: |
          set -euo pipefail
          gp -q -f research/harness/pari_fourier_6000.gp > /tmp/bsd-pari-coefficients-6000.txt 2>&1
          if grep -qF '***' /tmp/bsd-pari-coefficients-6000.txt; then
            tail -40 /tmp/bsd-pari-coefficients-6000.txt >&2
            exit 1
          fi
          test "$(wc -l < /tmp/bsd-pari-coefficients-6000.txt)" -eq 6000
      - name: Verify 6000 coefficients and negative-control mutation
        run: python -I -B research/harness/compare_fourier_coefficients_6000.py /tmp/bsd-pari-coefficients-6000.txt
      - name: Install pinned independent ball-arithmetic library
        run: |
          python -m pip install --only-binary=:all: --no-deps python-flint==0.9.0
      - name: Independent Arb twist derivative certificate on PARI coefficients
        run: python -I -B research/anticyclotomic_11/arb_twist_derivative.py /tmp/bsd-pari-coefficients-6000.txt
      - name: Construct certified anticyclotomic layers and division polynomials
        shell: bash
        run: |
          set -euo pipefail
          gp -s 128000000 -q -f research/proof_labs/pari_anticyclotomic_artin_t3.gp > /tmp/bsd-artin-oracle.txt 2>&1
          gp -q -f research/proof_labs/pari_kummer_11_torsors.gp > /tmp/bsd-kummer-oracle.txt 2>&1
          if grep -qF '***' /tmp/bsd-artin-oracle.txt /tmp/bsd-kummer-oracle.txt; then
            tail -30 /tmp/bsd-artin-oracle.txt
            tail -30 /tmp/bsd-kummer-oracle.txt
            exit 1
          fi
      - name: Compare every ideal Artin value and coefficient with independent arithmetic
        run: python -I -B research/proof_labs/anticyclotomic_artin_t3.py /tmp/bsd-artin-oracle.txt
      - name: Construct and verify five actual Kummer division torsors
        run: python -I -B research/proof_labs/kummer_11_torsors.py /tmp/bsd-kummer-oracle.txt
      - name: Independent minimal-model Kummer reduction certificate
        shell: bash
        run: |
          set -euo pipefail
          gp -q -f research/proof_labs/pari_kummer_reduction_11.gp > /tmp/bsd-reduction11.txt 2>&1
          if grep -qF '***' /tmp/bsd-reduction11.txt; then
            cat /tmp/bsd-reduction11.txt
            exit 1
          fi
      - name: Compare all reduction counts, generators and discrete logs
        run: python -I -B research/proof_labs/kummer_reduction_11_certificate.py /tmp/bsd-reduction11.txt

      - name: Independent minimal-model fine Kummer and targeted auxiliary prime
        shell: bash
        run: |
          set -euo pipefail
          gp -q -f research/proof_labs/pari_fine_localization_11.gp > /tmp/bsd-fine-localization33.txt 2>&1
          if grep -qF '***' /tmp/bsd-fine-localization33.txt; then
            cat /tmp/bsd-fine-localization33.txt
            exit 1
          fi
      - name: Compare local Kummer data and test supported obstruction certificates
        run: python -I -B research/proof_labs/fine_localization_height_detector.py /tmp/bsd-fine-localization33.txt

  direct-height:
    name: Direct-coordinate global first-height oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Complete first-digit ideal oracle and published controls
        run: python -I -B research/anticyclotomic_11/direct_coordinate_height_mod11.py

  kurihara-3389:
    name: Bounded Sage rational-symbol certificate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'research/session35-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve and record Sage10.6 image
        if: github.event_name == 'workflow_dispatch' || hashFiles('research/proof_labs/certificates/session35_kurihara_3389.txt') == ''
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 docker pull sagemath/sagemath:10.6@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb
          docker image inspect --format '{{json .RepoDigests}}' sagemath/sagemath:10.6@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb
          docker image inspect --format '{{.Id}}' sagemath/sagemath:10.6@sha256:19995db6194f4a4bab18ce9a88556fd15b9ed5e916b4504fefe618a7796ddbdb > /tmp/sage35-image.txt
      - name: Compute exact symbols within declared resource gate
        if: github.event_name == 'workflow_dispatch' || hashFiles('research/proof_labs/certificates/session35_kurihara_3389.txt') == ''
        shell: bash
        run: |
          set -euo pipefail
          image_id=$(cat /tmp/sage35-image.txt)
          timeout --signal=TERM --kill-after=15s 1200 docker run --rm --memory=6g --memory-swap=6g --cpus=2 --network=none -e HOME=/tmp -e SOURCE_HEAD="${{ github.event.pull_request.head.sha || github.sha }}" -v "$PWD:/work:ro" -w /work --entrypoint /home/sage/sage/sage "$image_id" -python research/proof_labs/sage_kurihara_3389.py 2>&1 | tee /tmp/kurihara35-transcript.txt
      - name: Independently verify the complete rational transcript
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B research/proof_labs/verify_kurihara_3389.py research/proof_labs/certificates/session35_kurihara_3389.txt
          if test -f /tmp/kurihara35-transcript.txt; then
            python3 -I -B research/proof_labs/verify_kurihara_3389.py /tmp/kurihara35-transcript.txt
          fi
